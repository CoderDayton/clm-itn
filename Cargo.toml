[package]
name = "clm-itn"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["CoderDayton (vii)"]
license = "Apache-2.0"
description = "Inverse text normalization for English: spoken numbers, times, dates and units to written form, under 1 µs p99 per short utterance."
repository = "https://github.com/CoderDayton/clm-itn"
readme = "README.md"
keywords = ["itn", "text-normalization", "speech", "asr", "nlp"]
categories = ["text-processing", "parsing"]
default-run = "clm-itn"
exclude = [".github/", "CLAUDE.md", "Scripts.toml", "lefthook.yml", "tools/", "tests/data/itn_benchmark.jsonl"]

[features]
default = ["std", "german"]
# Off: `#![no_std]` with `alloc`.
std = []
# Unstable engine internals for this repo's tests, bench and clm-learn. Not public API.
internals = ["std"]
german = []

[dev-dependencies]
# Turns on `internals` for tests and the bench only.
clm-itn = { path = ".", features = ["internals"] }

[profile.dev]
opt-level = 0
lto = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 16

[lints.rust]
# Set by build.rs when the `std` feature is off.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(clm_no_std)"] }

[[bin]]
name = "clm-itn"
path = "src/main.rs"
required-features = ["std"]

[[bin]]
name = "clm-learn"
path = "src/bin/clm-learn/main.rs"
required-features = ["internals"]

[[bench]]
name = "clm-bench"
harness = false
required-features = ["std"]

# The bench's unit tests; `cargo test` does not build bench targets.
[[test]]
name = "clm-bench"
path = "benches/clm-bench/unit.rs"
required-features = ["std"]
