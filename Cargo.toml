[package]
name = "clm-itn"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["vii (CoderDayton)"]
license = "Apache-2.0"
description = "Inverse text normalization for English: spoken numbers, times, dates and units to written form, with a 1 µs p99 fast path."
repository = "https://github.com/CoderDayton/clm-itn"
readme = "README.md"
keywords = ["itn", "text-normalization", "speech", "asr", "nlp"]
categories = ["text-processing", "parsing"]
default-run = "clm-itn"
exclude = [".github/", "CLAUDE.md", "Scripts.toml", "lefthook.yml", "tools/"]

[features]
default = ["std"]
# The CLI, the bench and eval tools, and the table builder.
std = ["alloc"]
# Normalizer::normalize, Normalizer::normalize_into and format_line.
alloc = []

[dependencies]

[profile.dev]
opt-level = 0
lto = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 16

[profile.benchmark]
inherits = "release"
lto = "thin" # Faster linking than "fat" while retaining 90% of performance gains
codegen-units = 4

[lints.rust]
# Set by build.rs when the `std` feature is off.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(clm_no_std)"] }

[[bin]]
name = "clm-itn"
path = "src/main.rs"
required-features = ["std"]

[[bin]]
name = "clm-bench"
path = "src/bin/clm-bench/main.rs"
required-features = ["std"]

[[bin]]
name = "clm-eval"
path = "src/bin/clm-eval/main.rs"
required-features = ["std"]

[[bin]]
name = "clm-learn"
path = "src/bin/clm-learn/main.rs"
required-features = ["std"]
